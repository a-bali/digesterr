# Digesterr configuration file.
#
# Copy this file to ~/.digesterr.yaml (the default location) or point the
# server at it with -c/--config <path>.
#
# Precedence (lowest to highest): built-in defaults < this file < environment
# variables < CLI flags (-c/--config, -d/--db, -p/--port, -l/--log-level).
#
# Environment variable names are the YAML paths uppercased with '.' -> '_',
# e.g. feed.sync_interval -> FEED_SYNC_INTERVAL. The legacy flat names
# (PORT, DATABASE_PATH, JWT_SECRET, LOG_LEVEL, LOG_BUFFER_SIZE,
# PUBLIC_BASE_URL, DIGESTERR_LOG_LEVEL) are still accepted; the canonical
# name wins when both are set.

server:
  # HTTP listen port.             [SERVER_PORT, legacy PORT]
  port: 8080
  # JWT signing secret. Required; the server refuses to start without it.
  #                                     [SERVER_JWT_SECRET, legacy JWT_SECRET]
  jwt_secret: ""
  # Absolute base URL of the web UI, used for links surfaced to Reader
  # clients. Empty means "derive from the request host".
  #                            [SERVER_PUBLIC_BASE_URL, legacy PUBLIC_BASE_URL]
  public_base_url: ""
  # Force the Secure flag on the refresh cookie. Omit (or leave unset) to
  # follow the request: Secure is set when the app itself terminates TLS.
  # Set this to true when TLS terminates at a reverse proxy, because the
  # request the app sees is plain HTTP and the cookie would otherwise be
  # issued without Secure. Leave it unset (not false) for a plain-HTTP
  # install such as a trusted LAN with no proxy, or browsers will refuse to
  # store the cookie and every reload will require a fresh sign-in.
  #                                        [SERVER_COOKIE_SECURE]
  # cookie_secure: true

db:
  # SQLite database file path.    [DB_PATH, legacy DATABASE_PATH]
  path: digesterr.db

logging:
  # One of debug, info, warn, error.   [LOGGING_LEVEL, legacy LOG_LEVEL]
  level: info
  # Capacity of the in-memory /api/logs ring buffer.
  #                          [LOGGING_BUFFER_SIZE, legacy LOG_BUFFER_SIZE]
  buffer_size: 1000

llm:
  # Base URL of any OpenAI-compatible API.  [LLM_ENDPOINT]
  endpoint: https://api.openai.com/v1
  # API key for digest generation. A digest config that needs the LLM logs an
  # error when this is empty.                                    [LLM_API_KEY]
  api_key: ""
  # Model name used for digest summaries.              [LLM_MODEL]
  model: gpt-4o-mini
  # Timeout for a single LLM request, covering both the wait for response
  # headers and reading the body. Durations accept Go syntax (90s, 5m) plus
  # d/mo/y suffixes. Raise this when the endpoint is a gateway that retries or
  # fails over between providers: one request to the gateway can become several
  # sequential upstream attempts, each with its own timeout, so this value must
  # exceed the gateway's per-attempt budget times the number of attempts it may
  # make. Otherwise the client gives up mid-failover and discards an answer
  # that was still on its way.
  # Defaults to 5m.                                     [LLM_TIMEOUT]
  timeout: 5m
  # System prompt for per-item summaries. {content_sentences} and
  # {comment_sentences} are replaced with the requested length, either a single
  # count ("9") or a range ("12-18"), and {style} with the character of the
  # chosen preset (a one-line gist / a balanced summary / a detailed summary),
  # so a custom prompt still follows the length picked in the UI.
  # Empty means a built-in default.
  #                                             [LLM_SUMMARY_PROMPT]
  summary_prompt: ""

feed:
  # How often feeds are polled for new items. Durations accept Go syntax
  # (30m, 1h) plus d/mo/y suffixes (30d, 6mo, 1y).        [FEED_SYNC_INTERVAL]
  sync_interval: 1h
  # Delete items older than this during feed refresh and digest generation.
  # Saved items are never deleted.                           [FEED_EXPIRE_ITEMS]
  expire_items: 1y
  # Delete digest results older than this.                   [FEED_EXPIRE_DIGESTS]
  expire_digests: 1y
  # How long after insertion items remain eligible for periodic
  # score re-enrichment. Zero means 24h (default).
  #                                         [FEED_ENRICHMENT_WINDOW]
  # enrichment_window: 24h

  # User-Agent header for all outbound HTTP requests.
  # Empty means a built-in desktop-browser string.
  #                                   [FEED_USER_AGENT]
  # user_agent: "Mozilla/5.0 ..."

  # Max tweets fetched per poll (Twitter API max: 20).
  #                                   [FEED_TWITTER_COUNT]
  # twitter_count: 20

  # Max posts fetched per subreddit poll (Reddit JSON API).
  #                                   [FEED_REDDIT_COUNT]
  # reddit_count: 25

  # Max HN items to resolve per Algolia enrichment batch.
  # Zero = unbounded (resolve all pending items).
  #                                   [FEED_HN_ENRICH_COUNT]
  # hn_enrich_count: 0

  # Max Lobste.rs stories per poll. Zero = all from RSS.
  #                                   [FEED_LOBSTERS_ENRICH_COUNT]
  # lobsters_enrich_count: 0

  # Max concurrent on-demand content extractions (Extract button).
  # Zero = 4 (default).                              [FEED_EXTRACT_CONCURRENCY]
  # extract_concurrency: 4

  # Max feeds fetched at once per poll cycle. Zero = 4 (default).
  #                                         [FEED_POLL_CONCURRENCY]
  # poll_concurrency: 4

  # Timeout for one feed's whole poll (fetch + enrich + extract).
  # Zero = 5m (default).                                [FEED_POLL_TIMEOUT]
  # poll_timeout: 5m

digest:
  # IANA timezone used to evaluate digest cron schedules (e.g. Europe/Paris).
  # Empty means the server's local timezone.            [DIGEST_SCHEDULER_TIMEZONE]
  scheduler_timezone: ""

reddit:
  # Reddit API credentials for reddit feed enrichment. Enrichment logs an
  # error when a reddit feed needs them and they are missing.
  client_id: ""            # [REDDIT_CLIENT_ID]
  client_secret: ""        # [REDDIT_CLIENT_SECRET]

twitter:
  # Twitter/X session cookies for twitter feed fetching. Same cookies as
  # Nitter: ct0 (CSRF token) and auth_token (session cookie). Copy them from
  # a logged-in browser session (DevTools → Cookies → x.com).
  # Enrichment/fetching logs an error when a twitter feed needs them and
  # they are missing.
  ct0: ""        # [TWITTER_CT0]
  auth_token: "" # [TWITTER_AUTH_TOKEN]


oidc:
  # Optional native OpenID Connect sign-in. Disabled by default: local signup,
  # password sign-in and Reader API keys keep working exactly as before, with
  # or without this section.
  #
  # When enabled, the server performs the authorization-code flow with PKCE
  # itself, reads the provider's discovery document at startup (startup fails
  # if the issuer is unreachable or the document's issuer disagrees with
  # oidc.issuer), and logs the user in through the same session the password
  # form creates.
  #
  # Read docs/oidc.md before enabling this: first-login email matching hands an
  # existing account to whoever the provider says owns the address, which is
  # only safe with a provider you control and open signup closed. That file also
  # covers offboarding and session revocation.
  enabled: false                      # [OIDC_ENABLED]

  # The provider's issuer identifier, exactly as it appears in the `iss` claim
  # and in its discovery document (including any path, and any trailing slash).
  # Must be https; plain http is accepted only for loopback (local testing).
  #                                         [OIDC_ISSUER]
  issuer: ""

  # Registered confidential client. A client secret is required: the code is
  # exchanged on the server, so this is not a public client.
  #                                    [OIDC_CLIENT_ID, OIDC_CLIENT_SECRET]
  client_id: ""
  client_secret: ""

  # The exact callback registered with the provider. It must be absolute, use
  # https (loopback excepted), carry no query or fragment, and end in
  # /api/auth/oidc/callback. It is never derived from the request Host header.
  #                                        [OIDC_REDIRECT_URL]
  redirect_url: ""

  # Label on the sign-in button ("Continue with <name>"). Empty means
  # "single sign-on".                            [OIDC_PROVIDER_NAME]
  provider_name: ""

  # Scopes to request. Comma- or space-separated. Must include openid; the
  # default is openid, email, profile and is the minimum this feature needs.
  #                                                 [OIDC_SCOPES]
  # scopes: [openid, email, profile]
