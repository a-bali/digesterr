# Digesterr development configuration (Hermes container dev loop).
# Loaded by air via -c/--config (see .air.toml build.cmd).
# Secrets are NOT stored here — they stay in .env (gitignored) and are
# overlaid by the canonical SERVER_*/LLM_*/REDDIT_* env vars that air loads.
#
# Precedence: built-in defaults < this file < environment (.env) < CLI flags.

server:
  # air's .env provides SERVER_PORT / SERVER_PUBLIC_BASE_URL; keep this file
  # minimal so env wins where it matters.
  port: 8080
  jwt_secret: ""
  public_base_url: ""

db:
  path: /opt/data/workspace/digesterr/data/digesterr.db

logging:
  level: debug
  buffer_size: 1000

llm:
  endpoint: https://ai.xba.li/v1
  api_key: ""
  model: virtual-regular

feed:
  sync_interval: 15m
  expire_items: 1y
  expire_digests: 1y
  # How long items stay eligible for periodic score re-enrichment.
  enrichment_window: 24h

reddit:
  client_id: ""
  client_secret: ""
