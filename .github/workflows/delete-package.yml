name: Delete GHCR package version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to delete (e.g. v0.3.0)"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Get package version ID
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
              package_type: 'container',
              package_name: 'digesterr'
            });
            const target = '${{ inputs.version }}';
            const version = versions.data.find(v =>
              v.metadata?.container?.tags?.includes(target)
            );
            if (!version) {
              core.setFailed(`Version ${target} not found in GHCR packages`);
              return;
            }
            core.setOutput('id', version.id);
            console.log(`Found version ID: ${version.id} for tag ${target}`);
      - name: Delete package version
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.packages.deletePackageVersionForAuthenticatedUser({
              package_type: 'container',
              package_name: 'digesterr',
              package_version_id: ${{ steps.version.outputs.id }}
            });
            console.log(`Deleted version ${{ inputs.version }} (ID: ${{ steps.version.outputs.id }})`);
