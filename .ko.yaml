defaultBaseImage: alpine:3.20
defaultPlatforms:
  - linux/amd64
builds:
  - id: digesterr
    dir: .
    main: ./cmd/digesterr
    env:
      - CGO_ENABLED=0
      - GOOS=linux
      - GOARCH=amd64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X digesterr/internal/httpapi.Version={{.Env.VERSION}}
