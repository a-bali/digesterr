# Air config — Go backend hot reload (dev mode).
# Frontend runs separately: `pnpm --dir web dev` (vite HMR on :10001, proxies /api -> :8080).
# poll=true is required on overlayfs (this container); harmless elsewhere.
root = "."
tmp_dir = "tmp"

env_files = [".env"]

[build]
  cmd = "go build -o ./tmp/digesterr ./cmd/digesterr"
  bin = "./tmp/digesterr"
  poll = true
  poll_interval = 500
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "tmp", "data", ".git", "node_modules", "bin", "cmd/digesterr/static"]
  exclude_regex = ["_test\\.go$"]
  stop_on_error = true
  delay = 1000
  send_interrupt = true
  kill_delay = 500

[log]
  time = true
  main_only = false
