# Air config — REFERENCE for normal filesystems (macOS/Linux with working inotify).
# On this Hermes container (overlayfs) air's watcher does NOT detect changes
# (poll and fsnotify both fail) — use scripts/dev-backend.sh (entr) instead:
#   bash scripts/dev-backend.sh   # Go backend hot reload (port from .env, e.g. 10001)
#   pnpm --dir web dev            # vite HMR frontend (port 5173, proxies /api -> :10001)
root = "."
tmp_dir = "tmp"

env_files = [".env"]

[build]
  cmd = "go build -o ./tmp/digesterr ./cmd/digesterr"
  bin = "./tmp/digesterr"
  poll = true
  poll_interval = 500
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "tmp", "data", ".git", "node_modules", "bin", "cmd/digesterr/static"]
  exclude_regex = ["_test\\.go$"]
  stop_on_error = true
  delay = 1000
  send_interrupt = true
  kill_delay = 500

[log]
  time = true
  main_only = false
